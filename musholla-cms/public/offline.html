<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tanpa Sambungan — Musholla Al Karim</title>
<style>
    :root { --hijau-tua: #1b4332; --hijau-lembut: #3f7d5c; --hijau-muda: #edf5f0; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--hijau-muda);
        color: var(--hijau-tua); padding: 1.5rem; text-align: center; }
    .kotak { background: #fff; border-radius: 18px; padding: 2rem 1.6rem; max-width: 420px; width: 100%;
        box-shadow: 0 8px 30px rgba(20, 60, 40, .08); }
    h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
    p { margin: 0 0 1.2rem; font-size: .95rem; line-height: 1.65; color: #3c5348; }
    a.tbl { display: inline-block; background: var(--hijau-lembut); color: #fff; text-decoration: none;
        font-weight: 600; font-size: .92rem; padding: .6rem 1.2rem; border-radius: 999px; }
    .lambang { font-size: 2.2rem; margin-bottom: .6rem; }
</style>
</head>
<body>
    <div class="kotak">
        <div class="lambang">🕌</div>
        <h1>Sedang tanpa sambungan</h1>
        <p>Halaman ini belum bisa dimuat karena jaringan sedang terputus. Tulisan yang pernah dibuka masih bisa dilihat dari simpanan peramban.</p>
        <a class="tbl" href="/">Coba lagi</a>
    </div>
</body>
</html>
